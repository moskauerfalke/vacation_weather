<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Погода на 11 дней</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ee;
      --panel: #ffffff;
      --ink: #202327;
      --muted: #68707a;
      --line: #d9dde3;
      --temp: #d64545;
      --rain: #2f7ed8;
      --prob: #188c8c;
      --sun: #d59b1f;
      --shadow: 0 14px 36px rgba(38, 43, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0)),
        var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1280px, calc(100% - 8px));
      margin: 0 auto;
      padding: 4px 0;
    }

    .mobile-view-tabs {
      display: none;
    }

    .app-layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr);
      gap: 6px;
      align-items: start;
    }

    .forecast-panel,
    .analytics-panel {
      min-width: 0;
    }

    .city-list {
      display: grid;
      gap: 4px;
    }

    .city-card {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      align-items: stretch;
      background: var(--panel);
      border: 1px solid rgba(70, 75, 83, 0.1);
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(38, 43, 51, 0.06);
      overflow: hidden;
    }

    .city-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px 6px;
      border-right: 1px solid rgba(104, 112, 122, 0.16);
      background: #fbfcfd;
    }

    .city-title {
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.02;
      text-align: center;
      text-wrap: balance;
    }

    .place-icon {
      width: 54px;
      height: 40px;
      display: grid;
      place-items: center;
    }

    .place-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .chart-wrap {
      width: 100%;
      padding: 0 6px 5px;
      overflow-x: auto;
    }

    .chart {
      display: block;
      width: 100%;
      min-width: 0;
      height: 128px;
    }

    .axis-text {
      fill: #68707a;
      font-size: 9px;
    }

    .grid-line {
      stroke: var(--line);
      stroke-width: 1;
      stroke-dasharray: 4 5;
    }

    .temp-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.2;
    }

    .point {
      stroke: #ffffff;
      stroke-width: 2;
    }

    .value-label {
      fill: #313842;
      font-size: 9px;
      font-weight: 700;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .day-date {
      fill: #3c434d;
      font-size: 9px;
      font-weight: 700;
    }

    .metric-label {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .rain-bar,
    .sun-bar {
      rx: 3;
      opacity: 0.78;
    }

    .loading,
    .error {
      padding: 24px 20px 30px;
      color: var(--muted);
    }

    .error {
      grid-column: 1 / -1;
      color: #9a2d2d;
    }

    .analytics-panel {
      display: grid;
      gap: 6px;
    }

    .analytics-card {
      background: var(--panel);
      border: 1px solid rgba(70, 75, 83, 0.1);
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(38, 43, 51, 0.06);
      padding: 8px;
    }

    .analytics-title {
      margin: 0 0 6px;
      font-size: 0.98rem;
      line-height: 1.1;
    }

    .analytics-note {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.25;
    }

    .trip-list {
      display: grid;
      gap: 5px;
    }

    .trip-card {
      display: grid;
      gap: 5px;
      padding: 7px;
      border: 1px solid rgba(104, 112, 122, 0.16);
      border-left: 8px solid var(--muted);
      border-radius: 6px;
      background: #fbfcfd;
    }

    .trip-card.green {
      border-left-color: #1f9d55;
      background: #f2fbf5;
    }

    .trip-card.orange {
      border-left-color: #d58a12;
      background: #fff8ec;
    }

    .trip-card.red {
      border-left-color: #c43d3d;
      background: #fff3f2;
    }

    .trip-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .trip-name {
      margin: 0;
      font-size: 0.86rem;
      line-height: 1.15;
    }

    .traffic {
      flex: 0 0 auto;
      padding: 3px 7px;
      border-radius: 999px;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .traffic.green {
      background: #1f9d55;
    }

    .traffic.orange {
      background: #d58a12;
    }

    .traffic.red {
      background: #c43d3d;
    }

    .trip-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 0;
      color: #343b45;
      font-size: 0.72rem;
      line-height: 1.25;
    }

    .metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(104, 112, 122, 0.14);
      white-space: nowrap;
    }

    .trip-reason {
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.24;
    }

    @media (max-width: 820px) {
      main {
        width: min(100% - 6px, 1280px);
      }

      .app-layout {
        grid-template-columns: 1fr;
      }

      .city-card {
        grid-template-columns: 76px minmax(0, 1fr);
      }

      .place-icon {
        width: 46px;
        height: 34px;
      }

      .city-title {
        font-size: 0.72rem;
      }

      .chart {
        min-width: 0;
        height: 130px;
      }

      .axis-text,
      .value-label,
      .day-date {
        font-size: 12px;
      }

      .metric-label {
        font-size: 11px;
      }
    }

    @media (max-width: 520px) {
      body {
        background: var(--bg);
      }

      main {
        width: 100%;
        padding: 3px;
      }

      .mobile-view-tabs {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
        padding-bottom: 3px;
        background: var(--bg);
      }

      .view-tab {
        min-height: 36px;
        border: 1px solid rgba(70, 75, 83, 0.18);
        border-radius: 6px;
        background: #ffffff;
        color: var(--ink);
        font: inherit;
        font-size: 0.9rem;
        font-weight: 800;
      }

      .view-tab.active {
        background: #202327;
        color: #ffffff;
      }

      body.mobile-show-forecast .analytics-panel,
      body.mobile-show-analytics .forecast-panel {
        display: none;
      }

      .city-list {
        gap: 3px;
      }

      .city-card {
        grid-template-columns: 1fr;
      }

      .city-head {
        flex-direction: row;
        justify-content: flex-start;
        gap: 8px;
        min-height: 40px;
        padding: 3px 8px;
        border-right: 0;
        border-bottom: 1px solid rgba(104, 112, 122, 0.16);
      }

      .place-icon {
        flex: 0 0 42px;
        width: 42px;
        height: 30px;
      }

      .city-title {
        font-size: 0.9rem;
        text-align: left;
      }

      .chart-wrap {
        padding: 0 3px 4px;
        overflow-x: hidden;
      }

      .chart {
        height: 154px;
      }

      .analytics-card {
        padding: 7px;
      }

      .analytics-title {
        font-size: 1rem;
      }

      .trip-card {
        padding: 7px;
      }

      .axis-text,
      .value-label,
      .day-date {
        font-size: 10px;
      }

      .metric-label {
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <main>
    <nav class="mobile-view-tabs" aria-label="Переключатель разделов">
      <button class="view-tab active" type="button" data-view="forecast">Прогноз</button>
      <button class="view-tab" type="button" data-view="analytics">Аналитика</button>
    </nav>
    <div class="app-layout">
      <section class="forecast-panel" aria-label="Прогноз погоды">
        <div class="city-list" id="cities" aria-live="polite"></div>
      </section>
      <section class="analytics-panel" id="analytics" aria-label="Аналитика поездок">
        <article class="analytics-card">
          <p class="loading">Считаю рекомендации...</p>
        </article>
      </section>
    </div>
  </main>

  <script>
    const cities = [
      { name: "Интерлакен", country: "Швейцария", lat: 46.6863, lon: 7.8632 },
      { name: "Фисп", country: "Швейцария", lat: 46.2937, lon: 7.8815 },
      { name: "Ла-Специя", country: "Италия", lat: 44.1025, lon: 9.8241 },
      { name: "Челле-Лигуре", country: "Италия", lat: 44.3451, lon: 8.5469 },
      { name: "Венеция", country: "Италия", lat: 45.4408, lon: 12.3155 }
    ];

    const chartProfiles = {
      desktop: {
        width: 640,
        height: 128,
        margin: { top: 14, right: 24, bottom: 48, left: 18 },
        barMin: 7,
        barMax: 15,
        barFactor: 0.2,
        pointRadius: 3.1,
        labelOffsets: [-7, -15],
        dayRows: [11, 22, 33, 44]
      },
      tablet: {
        width: 760,
        height: 130,
        margin: { top: 14, right: 8, bottom: 52, left: 24 },
        barMin: 8,
        barMax: 18,
        barFactor: 0.22,
        pointRadius: 3.2,
        labelOffsets: [-7, -15],
        dayRows: [12, 25, 38, 50]
      },
      mobile: {
        width: 390,
        height: 154,
        margin: { top: 18, right: 6, bottom: 62, left: 16 },
        barMin: 5,
        barMax: 10,
        barFactor: 0.18,
        pointRadius: 2.9,
        labelOffsets: [-7, -15],
        dayRows: [14, 29, 44, 59]
      }
    };

    const settings = {
      forecastDays: 11
    };

    const colors = {
      temp: getComputedStyle(document.documentElement).getPropertyValue("--temp").trim(),
      rain: getComputedStyle(document.documentElement).getPropertyValue("--rain").trim(),
      prob: getComputedStyle(document.documentElement).getPropertyValue("--prob").trim(),
      sun: getComputedStyle(document.documentElement).getPropertyValue("--sun").trim()
    };

    const nf = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 1 });
    const dayFmt = new Intl.DateTimeFormat("ru-RU", { day: "2-digit", month: "2-digit" });
    const rangeFmt = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "short" });
    const citiesRoot = document.querySelector("#cities");
    const analyticsRoot = document.querySelector("#analytics");
    let loadedForecasts = [];

    document.body.classList.add("mobile-show-forecast");
    init();
    setupViewTabs();

    window.addEventListener("resize", debounce(() => {
      if (loadedForecasts.length) {
        renderForecasts();
      }
    }, 180));

    async function init() {
      renderLoadingCards();

      try {
        loadedForecasts = await Promise.all(cities.map(loadForecast));
        renderForecasts();
        citiesRoot.dataset.loaded = "true";
      } catch (error) {
        console.error(error);
        citiesRoot.dataset.loaded = "false";
        citiesRoot.innerHTML = `<div class="city-card"><p class="error">Open-Meteo сейчас недоступен или соединение заблокировано. Попробуйте обновить страницу позже.</p></div>`;
        analyticsRoot.innerHTML = `<article class="analytics-card"><p class="error">Без прогноза аналитику посчитать не удалось.</p></article>`;
      }
    }

    function renderForecasts() {
      citiesRoot.innerHTML = loadedForecasts.map(renderCityCard).join("");
      analyticsRoot.innerHTML = renderAnalytics(loadedForecasts);
    }

    function setupViewTabs() {
      document.querySelectorAll(".view-tab").forEach((button) => {
        button.addEventListener("click", () => {
          const view = button.dataset.view;
          document.body.classList.toggle("mobile-show-forecast", view === "forecast");
          document.body.classList.toggle("mobile-show-analytics", view === "analytics");
          document.querySelectorAll(".view-tab").forEach((tab) => {
            tab.classList.toggle("active", tab === button);
          });
        });
      });
    }

    function renderLoadingCards() {
      citiesRoot.innerHTML = cities.map((city) => `
        <article class="city-card">
          <div class="city-head">
            ${renderPlaceIcon(city.country)}
            <h2 class="city-title">${escapeHtml(city.name)}</h2>
          </div>
          <p class="loading">Загружаю прогноз...</p>
        </article>
      `).join("");
    }

    async function loadForecast(city) {
      const params = new URLSearchParams({
        latitude: city.lat,
        longitude: city.lon,
        daily: [
          "temperature_2m_max",
          "precipitation_sum",
          "precipitation_probability_max",
          "sunshine_duration"
        ].join(","),
        forecast_days: settings.forecastDays,
        timezone: "auto"
      });

      const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
      if (!response.ok) {
        throw new Error(`Open-Meteo ${response.status}`);
      }
      const payload = await response.json();
      const daily = payload.daily;

      return {
        ...city,
        timezone: payload.timezone_abbreviation || payload.timezone || "",
        days: daily.time.map((date, index) => ({
          date,
          temp: toNumber(daily.temperature_2m_max[index]),
          rain: toNumber(daily.precipitation_sum[index]),
          prob: toNumber(daily.precipitation_probability_max[index]),
          sun: toNumber(daily.sunshine_duration[index]) / 3600
        }))
      };
    }

    function renderCityCard(city) {
      return `
        <article class="city-card">
          <div class="city-head">
            ${renderPlaceIcon(city.country)}
            <h2 class="city-title">${escapeHtml(city.name)}</h2>
          </div>
          <div class="chart-wrap">${renderChart(city)}</div>
        </article>
      `;
    }

    function renderAnalytics(forecasts) {
      const analytics = buildAnalytics(forecasts);

      return `
        <article class="analytics-card">
          <h2 class="analytics-title">Лучшие совместимые окна</h2>
          <p class="analytics-note">Сегодня исключён: это дорожный день. Швейцария и море считаются как две отдельные поездки; между ними обязателен минимум 1 день перерыва.</p>
          <div class="trip-list">
            ${renderTripCard(analytics.bestPair?.swiss, "Швейцария")}
            ${renderTripCard(analytics.bestPair?.sea, analytics.bestPair?.sea ? `Море: ${analytics.bestPair.sea.city}` : "Море")}
          </div>
        </article>
        <article class="analytics-card">
          <h2 class="analytics-title">Швейцария: Интерлакен -> Фисп</h2>
          <div class="trip-list">${analytics.swiss.map((trip) => renderTripCard(trip, "2 дня")).join("")}</div>
        </article>
        <article class="analytics-card">
          <h2 class="analytics-title">Море: 4 дня</h2>
          <div class="trip-list">${analytics.sea.map((trip) => renderTripCard(trip, trip.city)).join("")}</div>
        </article>
      `;
    }

    function renderTripCard(trip, label) {
      if (!trip) {
        return `<div class="trip-card red"><p class="trip-reason">Недостаточно дней прогноза.</p></div>`;
      }

      const meta = trip.metrics.map((metric) => `<span class="metric-pill">${metric}</span>`).join("");

      return `
        <section class="trip-card ${trip.color}">
          <div class="trip-head">
            <h3 class="trip-name">${escapeHtml(label)} · ${escapeHtml(trip.range)}</h3>
            <span class="traffic ${trip.color}">${trafficLabel(trip.color)}</span>
          </div>
          <p class="trip-meta">${meta}</p>
          <p class="trip-reason">${escapeHtml(trip.reason)}</p>
        </section>
      `;
    }

    function buildAnalytics(forecasts) {
      const byName = Object.fromEntries(forecasts.map((city) => [city.name, city]));
      const analyticsStartDate = getAnalyticsStartDate();
      const swiss = buildSwissTrips(byName["Интерлакен"], byName["Фисп"], analyticsStartDate);
      const allSea = forecasts
        .filter((city) => city.country === "Италия")
        .flatMap((city) => buildSeaTrips(city, analyticsStartDate))
        .sort(compareTrips);
      const bestPair = findBestCompatiblePair(swiss, allSea);

      return {
        swiss: swiss.slice(0, 6),
        sea: allSea.slice(0, 9),
        bestPair
      };
    }

    function buildSwissTrips(interlaken, visp, analyticsStartDate) {
      if (!interlaken || !visp) {
        return [];
      }

      const interlakenDays = filterAnalyticsDays(interlaken.days, analyticsStartDate);
      const vispDays = filterAnalyticsDays(visp.days, analyticsStartDate);
      const limit = Math.min(interlakenDays.length, vispDays.length) - 1;
      return Array.from({ length: Math.max(0, limit) }, (_, index) => {
        const routeDays = [
          { city: "Интерлакен", ...interlakenDays[index] },
          { city: "Фисп", ...vispDays[index + 1] }
        ];
        const dayScores = routeDays.map(scoreSwissDay);
        const score = average(dayScores.map((day) => day.score));
        const totalRain = sum(routeDays, "rain");
        const maxRain = Math.max(...routeDays.map((day) => day.rain));
        const avgSun = average(routeDays.map((day) => day.sun));
        const maxProb = Math.max(...routeDays.map((day) => day.prob));
        const badDays = dayScores.filter((day) => day.score < 52 || day.rain > 8 || day.sun < 3).length;
        const color = classifySwiss(score, avgSun, totalRain, badDays);

        return {
          type: "swiss",
          color,
          score,
          range: `${formatRange(routeDays[0].date, routeDays.at(-1).date)}`,
          metrics: [
            `солнце ${nf.format(avgSun)}ч/день`,
            `макс. осадки ${nf.format(maxRain)}мм`,
            `риск до ${Math.round(maxProb)}%`
          ],
          reason: swissReason(color, routeDays, avgSun, maxRain, maxProb),
          startDate: routeDays[0].date,
          endDate: routeDays.at(-1).date,
          startIndex: index
        };
      }).sort(compareTrips);
    }

    function buildSeaTrips(city, analyticsStartDate) {
      const length = 4;
      const days = filterAnalyticsDays(city.days, analyticsStartDate);
      const limit = days.length - length + 1;
      return Array.from({ length: Math.max(0, limit) }, (_, index) => {
        const tripDays = days.slice(index, index + length);
        const dayScores = tripDays.map(scoreSeaDay);
        const avgScore = average(dayScores.map((day) => day.score));
        const worstScore = Math.min(...dayScores.map((day) => day.score));
        const score = avgScore * 0.62 + worstScore * 0.38;
        const minTemp = Math.min(...tripDays.map((day) => day.temp));
        const totalRain = sum(tripDays, "rain");
        const maxRain = Math.max(...tripDays.map((day) => day.rain));
        const avgSun = average(tripDays.map((day) => day.sun));
        const maxProb = Math.max(...tripDays.map((day) => day.prob));
        const badDays = dayScores.filter((day) => day.score < 55 || day.temp < 22 || day.rain > 6).length;
        const color = classifySea(score, minTemp, totalRain, avgSun, badDays);

        return {
          type: "sea",
          city: city.name,
          color,
          score,
          range: `${formatRange(tripDays[0].date, tripDays.at(-1).date)}`,
          metrics: [
            `мин ${nf.format(minTemp)}°`,
            `солнце ${nf.format(avgSun)}ч/день`,
            `макс. осадки ${nf.format(maxRain)}мм`,
            `риск до ${Math.round(maxProb)}%`
          ],
          reason: seaReason(color, city.name, tripDays, minTemp, maxRain, avgSun),
          startDate: tripDays[0].date,
          endDate: tripDays.at(-1).date,
          startIndex: index
        };
      });
    }

    function scoreSwissDay(day) {
      const sun = scoreByThresholds(day.sun, [
        [8, 100],
        [5, 76],
        [3, 48],
        [0, 18]
      ]);
      const rain = scoreReverse(day.rain, [
        [1, 100],
        [4, 72],
        [8, 35],
        [Infinity, 5]
      ]);
      const prob = scoreReverse(day.prob, [
        [25, 100],
        [55, 70],
        [80, 42],
        [Infinity, 18]
      ]);
      return { score: sun * 0.68 + rain * 0.22 + prob * 0.1, sun: day.sun, rain: day.rain };
    }

    function scoreSeaDay(day) {
      const temp = day.temp < 22
        ? Math.max(0, (day.temp - 18) * 12)
        : scoreByThresholds(day.temp, [
          [28, 100],
          [24, 92],
          [22, 76],
          [0, 0]
        ]);
      const rain = scoreReverse(day.rain, [
        [1, 100],
        [3, 76],
        [6, 42],
        [Infinity, 8]
      ]);
      const sun = scoreByThresholds(day.sun, [
        [9, 100],
        [7, 84],
        [5, 58],
        [0, 20]
      ]);
      const prob = scoreReverse(day.prob, [
        [25, 100],
        [55, 70],
        [80, 38],
        [Infinity, 15]
      ]);
      return { score: temp * 0.28 + rain * 0.32 + sun * 0.28 + prob * 0.12, temp: day.temp, rain: day.rain };
    }

    function classifySwiss(score, avgSun, totalRain, badDays) {
      if (score >= 76 && avgSun >= 5.5 && totalRain <= 6 && badDays === 0) {
        return "green";
      }
      if (score >= 54 && badDays <= 1 && totalRain <= 14) {
        return "orange";
      }
      return "red";
    }

    function classifySea(score, minTemp, totalRain, avgSun, badDays) {
      if (minTemp >= 22 && score >= 78 && totalRain <= 5 && avgSun >= 6.5 && badDays === 0) {
        return "green";
      }
      if (minTemp >= 21.5 && score >= 56 && totalRain <= 14 && badDays <= 1) {
        return "orange";
      }
      return "red";
    }

    function swissReason(color, days, avgSun, maxRain, maxProb) {
      const label = color === "green" ? "Супер" : color === "orange" ? "Можно, но не идеально" : "Лучше не планировать";
      return `${label}: ${days.map((day) => `${day.city} ${formatDate(day.date)}`).join(", ")}; солнца в среднем ${nf.format(avgSun)}ч/день, максимум осадков ${nf.format(maxRain)}мм за день, риск до ${Math.round(maxProb)}%.`;
    }

    function seaReason(color, city, days, minTemp, maxRain, avgSun) {
      const label = color === "green" ? "Супер для моря" : color === "orange" ? "Море возможно, но есть компромисс" : "Для моря не подходит";
      return `${label}: ${city}, ${formatRange(days[0].date, days.at(-1).date)}; минимум ${nf.format(minTemp)}°, солнца ${nf.format(avgSun)}ч/день, максимум осадков ${nf.format(maxRain)}мм за день.`;
    }

    function compareTrips(a, b) {
      const colorRank = { green: 3, orange: 2, red: 1 };
      return colorRank[b.color] - colorRank[a.color] || b.score - a.score || a.startIndex - b.startIndex;
    }

    function findBestCompatiblePair(swissTrips, seaTrips) {
      const pairs = swissTrips.flatMap((swiss) => (
        seaTrips
          .filter((sea) => tripsHaveRequiredBreak(swiss, sea))
          .map((sea) => ({
            swiss,
            sea,
            score: combinedTripScore(swiss, sea),
            bestColorRank: Math.min(colorValue(swiss.color), colorValue(sea.color))
          }))
      ));

      return pairs.sort((a, b) => (
        b.bestColorRank - a.bestColorRank ||
        b.score - a.score ||
        tripGapDays(a.swiss, a.sea) - tripGapDays(b.swiss, b.sea)
      ))[0] || null;
    }

    function tripsOverlap(a, b) {
      return dateValue(a.startDate) <= dateValue(b.endDate) && dateValue(b.startDate) <= dateValue(a.endDate);
    }

    function tripsHaveRequiredBreak(a, b) {
      return !tripsOverlap(a, b) && tripGapDays(a, b) >= 1;
    }

    function filterAnalyticsDays(days, analyticsStartDate) {
      return days.filter((day) => day.date >= analyticsStartDate);
    }

    function getAnalyticsStartDate() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      return toIsoDate(tomorrow);
    }

    function combinedTripScore(swiss, sea) {
      return swiss.score * 0.38 + sea.score * 0.62;
    }

    function colorValue(color) {
      return { green: 3, orange: 2, red: 1 }[color] || 0;
    }

    function tripGapDays(a, b) {
      if (tripsOverlap(a, b)) {
        return 0;
      }
      const dayMs = 24 * 60 * 60 * 1000;
      const gap = dateValue(a.startDate) > dateValue(b.endDate)
        ? dateValue(a.startDate) - dateValue(b.endDate)
        : dateValue(b.startDate) - dateValue(a.endDate);
      return Math.max(0, Math.round(gap / dayMs) - 1);
    }

    function dateValue(date) {
      return new Date(`${date}T12:00:00`).getTime();
    }

    function toIsoDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function trafficLabel(color) {
      return { green: "зелёный", orange: "оранжевый", red: "красный" }[color];
    }

    function renderPlaceIcon(country) {
      if (country === "Швейцария") {
        return `
          <div class="place-icon" aria-hidden="true">
            <svg viewBox="0 0 90 66" role="img">
              <defs>
                <linearGradient id="mountainSky" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0" stop-color="#65b7f3"></stop>
                  <stop offset="1" stop-color="#dff4ff"></stop>
                </linearGradient>
              </defs>
              <rect x="4" y="5" width="82" height="56" rx="12" fill="url(#mountainSky)"></rect>
              <circle cx="70" cy="18" r="7" fill="#ffd34f"></circle>
              <path d="M8 57 L30 24 L43 57 Z" fill="#4c7f52"></path>
              <path d="M26 57 L52 14 L82 57 Z" fill="#23618e"></path>
              <path d="M52 14 L43 29 L55 25 L62 36 L82 57 Z" fill="#1f4f78"></path>
              <path d="M45 25 L52 14 L61 27 L55 25 L51 32 Z" fill="#ffffff"></path>
              <path d="M25 32 L30 24 L36 34 L31 32 L28 38 Z" fill="#ffffff"></path>
            </svg>
          </div>
        `;
      }

      return `
        <div class="place-icon" aria-hidden="true">
          <svg viewBox="0 0 90 66" role="img">
            <defs>
              <linearGradient id="seaSky" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#ffd988"></stop>
                <stop offset="1" stop-color="#fff2c7"></stop>
              </linearGradient>
            </defs>
            <rect x="4" y="5" width="82" height="56" rx="12" fill="url(#seaSky)"></rect>
            <circle cx="68" cy="19" r="8" fill="#ff8f45"></circle>
            <path d="M7 42 C18 36 28 48 39 42 C50 36 61 48 83 39 L83 61 L7 61 Z" fill="#1d9cd7"></path>
            <path d="M7 51 C20 45 30 56 42 50 C55 44 66 56 83 48" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"></path>
            <path d="M11 37 C24 32 36 40 49 35 C61 30 70 36 80 32" fill="none" stroke="#32c4c7" stroke-width="5" stroke-linecap="round"></path>
          </svg>
        </div>
      `;
    }

    function renderChart(city) {
      const profile = getChartProfile();
      const { width, height, margin } = profile;
      const innerW = width - margin.left - margin.right;
      const innerH = height - margin.top - margin.bottom;
      const days = city.days;
      const xStep = innerW / (days.length - 1);
      const barW = Math.max(profile.barMin, Math.min(profile.barMax, xStep * profile.barFactor));

      const tempExtent = padExtent(days.map((d) => d.temp), 2);
      const rainMax = paddedMax(days.map((d) => d.rain), 1);
      const sunMax = Math.max(12, Math.ceil(Math.max(...days.map((d) => d.sun))));

      const x = (index) => margin.left + index * xStep;
      const yTemp = (value) => scale(value, tempExtent[0], tempExtent[1], margin.top + innerH, margin.top);
      const yRain = (value) => scale(value, 0, rainMax, margin.top + innerH, margin.top);
      const ySun = (value) => scale(value, 0, sunMax, margin.top + innerH, margin.top);

      const tempPath = linePath(days.map((d, i) => [x(i), yTemp(d.temp)]));

      return `
        <svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="График погоды для ${escapeHtml(city.name)} на 11 дней">
          ${gridLines(margin, innerH, innerW)}
          ${days.map((d, i) => renderBars(d, i, x, yRain, ySun, barW, margin.top + innerH)).join("")}
          <path class="temp-line" d="${tempPath}" stroke="${colors.temp}"></path>
          ${days.map((d, i) => renderTemperaturePoint(d, i, x, yTemp, profile)).join("")}
          ${days.map((d, i) => renderDayLabel(d, i, x, margin.top + innerH, profile)).join("")}
          <line x1="${margin.left}" y1="${margin.top + innerH}" x2="${width - margin.right}" y2="${margin.top + innerH}" stroke="#aeb5be"></line>
        </svg>
      `;
    }

    function getChartProfile() {
      if (window.matchMedia("(max-width: 520px)").matches) {
        return chartProfiles.mobile;
      }
      if (window.matchMedia("(max-width: 820px)").matches) {
        return chartProfiles.tablet;
      }
      return chartProfiles.desktop;
    }

    function renderBars(day, index, x, yRain, ySun, barW, baseY) {
      const rainH = Math.max(1, baseY - yRain(day.rain));
      const sunH = Math.max(1, baseY - ySun(day.sun));
      const cx = x(index);
      const rainX = cx - barW - 2;
      const sunX = cx + 2;

      return `
        <rect class="rain-bar" x="${rainX}" y="${baseY - rainH}" width="${barW}" height="${rainH}" fill="${colors.rain}">
          <title>${formatDate(day.date)}: осадки ${nf.format(day.rain)} мм</title>
        </rect>
        <rect class="sun-bar" x="${sunX}" y="${baseY - sunH}" width="${barW}" height="${sunH}" fill="${colors.sun}">
          <title>${formatDate(day.date)}: солнце ${nf.format(day.sun)} ч</title>
        </rect>
      `;
    }

    function renderTemperaturePoint(day, index, x, yTemp, profile) {
      const tempX = x(index);
      const tempY = yTemp(day.temp);
      const labelYOffset = profile.labelOffsets[index % 2];

      return `
        <circle class="point" cx="${tempX}" cy="${tempY}" r="${profile.pointRadius}" fill="${colors.temp}">
          <title>${formatDate(day.date)}: максимум ${nf.format(day.temp)} °C</title>
        </circle>
        <text class="value-label" x="${tempX}" y="${tempY + labelYOffset}" text-anchor="middle">${Math.round(day.temp)}°</text>
      `;
    }

    function renderDayLabel(day, index, x, baseY, profile) {
      const labelX = x(index);
      const [dateY, rainY, probY, sunY] = profile.dayRows;
      return `
        <g text-anchor="middle" aria-label="${formatDate(day.date)}: осадки ${nf.format(day.rain)} мм, вероятность ${Math.round(day.prob)}%, солнце ${nf.format(day.sun)} ч">
          <text class="day-date" x="${labelX}" y="${baseY + dateY}">${formatDate(day.date)}</text>
          <text class="metric-label" x="${labelX}" y="${baseY + rainY}" fill="${colors.rain}">${formatMetric(day.rain)}мм</text>
          <text class="metric-label" x="${labelX}" y="${baseY + probY}" fill="${colors.prob}">${Math.round(day.prob)}%</text>
          <text class="metric-label" x="${labelX}" y="${baseY + sunY}" fill="${colors.sun}">${formatMetric(day.sun)}ч</text>
        </g>
      `;
    }

    function gridLines(margin, innerH, innerW) {
      return [0, 0.25, 0.5, 0.75, 1].map((ratio) => {
        const y = margin.top + innerH * ratio;
        return `<line class="grid-line" x1="${margin.left}" y1="${y}" x2="${margin.left + innerW}" y2="${y}"></line>`;
      }).join("");
    }

    function padExtent(values, padding) {
      const min = Math.floor(Math.min(...values) - padding);
      const max = Math.ceil(Math.max(...values) + padding);
      if (min === max) {
        return [min - 1, max + 1];
      }
      return [min, max];
    }

    function paddedMax(values, fallback) {
      return Math.max(fallback, Math.ceil(Math.max(...values) * 1.2));
    }

    function scale(value, inMin, inMax, outMin, outMax) {
      if (inMax === inMin) {
        return (outMin + outMax) / 2;
      }
      return outMin + ((value - inMin) / (inMax - inMin)) * (outMax - outMin);
    }

    function linePath(points) {
      return points.map(([x, y], index) => `${index === 0 ? "M" : "L"} ${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
    }

    function sum(days, key) {
      return days.reduce((acc, day) => acc + day[key], 0);
    }

    function average(values) {
      return values.length ? values.reduce((acc, value) => acc + value, 0) / values.length : 0;
    }

    function scoreByThresholds(value, thresholds) {
      return thresholds.find(([threshold]) => value >= threshold)?.[1] ?? 0;
    }

    function scoreReverse(value, thresholds) {
      return thresholds.find(([threshold]) => value <= threshold)?.[1] ?? 0;
    }

    function toNumber(value) {
      return Number.isFinite(Number(value)) ? Number(value) : 0;
    }

    function formatDate(date) {
      return dayFmt.format(new Date(`${date}T12:00:00`));
    }

    function formatRange(startDate, endDate) {
      const start = rangeFmt.format(new Date(`${startDate}T12:00:00`));
      const end = rangeFmt.format(new Date(`${endDate}T12:00:00`));
      return `${start} - ${end}`;
    }

    function formatMetric(value) {
      if (Math.abs(value) >= 10) {
        return String(Math.round(value));
      }
      return nf.format(value);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function debounce(fn, delay) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }
  </script>
</body>
